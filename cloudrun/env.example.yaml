# Copy the values from Render (docs-to-video-demo -> Environment). Remove lines you don't use on Render.
# This file is ignored by git; it stays in your Cloud Shell.
MONGODB_URI: "PASTE from Render"
OPENROUTER_API_KEY: "PASTE from Render"
# Saved logins (Miter staging) are unlocked with the same secret as on Render: copy whichever of these
# three you have on Render, exactly as they are there.
LOGIN_SECRET: "PASTE from Render, or delete this line"
DEMO_PASSWORD: "PASTE from Render, or delete this line"
API_KEY: "PASTE from Render, or delete this line"
NARRATION: "on"
RECORD_ZOOM: "1"
# Links in finished videos point at the Render dashboard
PUBLIC_URL: "https://docs-to-video-demo.onrender.com"
# Cloud Run settings: only take jobs sent to Cloud Run, one video per machine
WORKER_POOL: "cloudrun"
RUN_ONCE: "1"
# Cost per job: 4 vCPU + 8 GiB on Cloud Run ~= $0.000088 a second = $231 a month equivalent
SERVER_USD_PER_MONTH: "231"
