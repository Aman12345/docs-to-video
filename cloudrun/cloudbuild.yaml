# Builds the worker image with BuildKit (the Dockerfile uses an optional build secret).
steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: ''
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
